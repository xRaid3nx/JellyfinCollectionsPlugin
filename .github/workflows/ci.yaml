name: CI

# Builds and tests every push. Skipped if the repository is ever made private again.
on:
  push:
    branches: [main, master]
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:

env:
  # Jellyfin server versions to build against. Adding one is a one-line change, e.g. ["12.2.0","12.3.0"].
  JELLYFIN_VERSIONS: '["12.2.0"]'

jobs:
  versions:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.set.outputs.list }}
    steps:
      - id: set
        run: echo "list=$JELLYFIN_VERSIONS" >> "$GITHUB_OUTPUT"

  build-test:
    needs: versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        jellyfin: ${{ fromJSON(needs.versions.outputs.list) }}
    name: Build & test (Jellyfin ${{ matrix.jellyfin }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build Jellyfin.Plugin.Collections.slnx -c Release -p:JellyfinVersion=${{ matrix.jellyfin }}
      - name: Test
        run: dotnet test Jellyfin.Plugin.Collections.slnx -c Release --no-build -p:JellyfinVersion=${{ matrix.jellyfin }}
