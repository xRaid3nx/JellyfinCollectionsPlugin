overview: "Add many movies and shows to a collection at once by pasting a list of titles."
description: >
  Paste a list of titles (one per line, optional year), type a collection name and click Preview.
  Paste Collections matches each line against your library, handles remakes that share a title,
  name variants and close spellings, and shows you exactly what it found. Apply adds the confirmed
  items to the collection (creating it if needed). Titles that aren't in your library are reported.
